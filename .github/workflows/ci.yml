name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run abi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Web UI (build + Playwright)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm ci --prefix web
          npx playwright install --with-deps chromium
          npm run test:web
